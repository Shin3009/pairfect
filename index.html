<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Pairfect: Tile Connect</title>
    <!-- Cùng hình với icon app Android, tạo bằng npm run icons (scripts/icons.mjs) -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      :root { --bg: #1f3b4d; }
      html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none; }
      /* App chạy toàn màn hình: nền phủ kín, còn game nằm trong vùng an toàn để "tai thỏ" / camera đục lỗ
         không che HUD. Màn hình không có tai thỏ thì các giá trị này bằng 0. */
      #game {
        position: fixed;
        top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px);
      }
      /* Game chỉ chơi màn ngang. App Android đã khóa hướng ngang; lời nhắc này dành cho trình duyệt đang dọc. */
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10;
        align-items: center; justify-content: center; padding: 24px; text-align: center;
        background: var(--bg); color: #fff;
        font: 600 24px "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      @media (orientation: portrait) { #rotate { display: flex; } }

      /* Hộp nhập tên người chơi (src/scenes/nameDialog.ts), cùng kiểu với hộp thoại vẽ bằng Phaser (showDialog).
         --u là một điểm ảnh logic của game (cao 720, rộng ít nhất 1100, xem ui.ts) để hộp to nhỏ theo game. */
      #name-dialog {
        --u: min(100vh / 720, 100vw / 1100);
        position: fixed; inset: 0; z-index: 5;
        display: flex; align-items: flex-start; justify-content: center;
        /* Lệch lên trên: bàn phím ảo che nửa dưới màn hình ngang */
        padding-top: calc(var(--u) * 90);
        background: rgba(0, 0, 0, 0.55);
        font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      #name-dialog[hidden], #name-dialog [hidden] { display: none; }
      #name-dialog .panel {
        width: calc(var(--u) * 640); box-sizing: border-box;
        padding: calc(var(--u) * 36) calc(var(--u) * 44);
        border-radius: calc(var(--u) * 28);
        background: #fffaf0; color: #2c5266; text-align: center;
      }
      #name-dialog h1 { margin: 0; color: #1f3b4d; font-size: calc(var(--u) * 48); line-height: 1.2; }
      #name-dialog p { margin: calc(var(--u) * 8) 0 calc(var(--u) * 28); font-size: calc(var(--u) * 26); }
      #name-dialog .row { display: flex; gap: calc(var(--u) * 14); }
      #name-dialog input, #name-dialog button {
        height: calc(var(--u) * 64); box-sizing: border-box; margin: 0;
        font: inherit; font-size: calc(var(--u) * 28);
      }
      #name-dialog input {
        flex: 1; min-width: 0; padding: 0 calc(var(--u) * 20);
        border: calc(var(--u) * 3) solid #b8d0dc; border-radius: calc(var(--u) * 16);
        background: #fff; color: #1f3b4d; outline: none;
      }
      #name-dialog input:focus { border-color: #ffc857; }
      #name-dialog button {
        min-width: calc(var(--u) * 130); padding: 0 calc(var(--u) * 24);
        border: 0; border-radius: calc(var(--u) * 32);
        background: #ffc857; color: #1f3b4d; font-weight: bold;
        cursor: pointer; -webkit-tap-highlight-color: transparent;
      }
      #name-dialog button:disabled { background: #6b8796; cursor: default; }

      /* Thông báo nhỏ ở giữa mép trên (src/toast.ts), ví dụ kết quả gửi kỷ lục lên mạng. Không nhận chạm. */
      #toast {
        --u: min(100vh / 720, 100vw / 1100);
        position: fixed; z-index: 6; left: 50%;
        top: calc(env(safe-area-inset-top, 0px) + var(--u) * 16);
        /* max-content: với left 50%, khung chỉ được co trong nửa phải màn hình nên chữ xuống dòng quá sớm */
        width: max-content; max-width: calc(var(--u) * 900); box-sizing: border-box;
        display: flex; align-items: center; gap: calc(var(--u) * 14);
        padding: calc(var(--u) * 12) calc(var(--u) * 28) calc(var(--u) * 12) calc(var(--u) * 14);
        border-radius: calc(var(--u) * 32);
        background: #fffaf0; color: #1f3b4d;
        box-shadow: 0 calc(var(--u) * 6) calc(var(--u) * 20) rgba(0, 0, 0, 0.35);
        font: 600 calc(var(--u) * 24) / 1.3 "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        pointer-events: none;
        opacity: 0; transform: translate(-50%, calc(var(--u) * -24));
        transition: opacity 0.25s, transform 0.25s;
      }
      #toast.show { opacity: 1; transform: translate(-50%, 0); }
      /* Biểu tượng tròn đầu dòng: dấu tích xanh khi thành công, dấu chấm than đỏ khi lỗi */
      #toast::before {
        flex: none; display: grid; place-items: center;
        width: calc(var(--u) * 36); height: calc(var(--u) * 36); border-radius: 50%;
        background: #2f9e44; color: #fff; font-size: calc(var(--u) * 22); font-weight: bold;
        content: "\2713";
      }
      #toast[data-kind="error"]::before { background: #e8505b; content: "!"; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <form id="name-dialog" hidden autocomplete="off">
      <div class="panel">
        <h1 id="name-title"></h1>
        <p id="name-body"></p>
        <div class="row">
          <input id="name-input" type="text" placeholder="Tên của bạn" enterkeyhint="done" autocapitalize="words" spellcheck="false" />
          <button id="name-cancel" type="button">Hủy</button>
          <button id="name-ok" type="submit">Lưu</button>
        </div>
      </div>
    </form>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="rotate">Xoay ngang thiết bị để chơi</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
