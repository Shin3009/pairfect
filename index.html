<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Pairfect: Tile Connect</title>
    <style>
      :root { --bg: #1f3b4d; }
      html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none; }
      /* App chạy toàn màn hình: nền phủ kín, còn game nằm trong vùng an toàn để "tai thỏ" / camera đục lỗ
         không che HUD. Màn hình không có tai thỏ thì các giá trị này bằng 0. */
      #game {
        position: fixed;
        top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px);
      }
      /* Game chỉ chơi màn ngang. App Android đã khóa hướng ngang; lời nhắc này dành cho trình duyệt đang dọc. */
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10;
        align-items: center; justify-content: center; padding: 24px; text-align: center;
        background: var(--bg); color: #fff;
        font: 600 24px "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      @media (orientation: portrait) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">Xoay ngang thiết bị để chơi</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
